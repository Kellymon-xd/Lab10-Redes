name: deploy

on:
  push:
    branches: [main]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Preparar version del commit
        id: version
        run: |
          SHA_CORTO="${GITHUB_SHA:0:7}"
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          echo "tag=$SHA_CORTO" >> "$GITHUB_OUTPUT"
          echo "imagen=ghcr.io/$OWNER/pagosya-api:$SHA_CORTO" >> "$GITHUB_OUTPUT"

      - name: Iniciar sesion en el registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir imagen Docker
        run: |
          docker build \
            --build-arg APP_VERSION="${{ steps.version.outputs.tag }}" \
            -t "${{ steps.version.outputs.imagen }}" \
            ./app

      - name: Arrancar contenedor
        run: |
          docker run -d \
            --name pagosya-test \
            -p 127.0.0.1:8080:8000 \
            "${{ steps.version.outputs.imagen }}"

      - name: Smoke test de PagosYA
        run: |
          for i in $(seq 1 30); do
            RESPUESTA=$(curl -fsS --max-time 2 http://localhost:8080/health-fallo 2>/dev/null) || true

            if [ "$RESPUESTA" = "ok" ]; then
              echo "SMOKE TEST EXITOSO"
              exit 0
            fi

            sleep 1
          done

          echo "ERROR: Smoke test fallido"
          docker logs pagosya-test
          exit 1

      - name: Publicar imagen Docker
        run: |
          docker push "${{ steps.version.outputs.imagen }}"
